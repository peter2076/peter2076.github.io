<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Ride with Sky — A Horseback Open World v2</title>
<style>
  :root {
    --hud-bg: rgba(8, 12, 20, 0.55);
    --hud-border: rgba(255, 255, 255, 0.12);
    --hud-fg: #f0f4ff;
    --hud-accent: #ffb86b;
    --hud-warn: #ff5d6c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #000;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", "Segoe UI", system-ui, sans-serif;
    color: var(--hud-fg);
    user-select: none;
    -webkit-user-select: none;
  }
  #canvas { display: block; width: 100vw; height: 100vh; cursor: crosshair; }
  #hud {
    position: fixed; top: 16px; left: 16px;
    padding: 14px 18px;
    background: var(--hud-bg);
    border: 1px solid var(--hud-border);
    border-radius: 12px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    min-width: 220px;
    font-size: 13px; line-height: 1.7;
    pointer-events: none; z-index: 10;
  }
  #hud h1 {
    font-size: 14px; font-weight: 600; letter-spacing: 0.5px;
    margin-bottom: 6px; color: var(--hud-accent); text-transform: uppercase;
  }
  #hud .row { display: flex; justify-content: space-between; gap: 16px; }
  #hud .label { opacity: 0.65; }
  #hud .value { font-variant-numeric: tabular-nums; font-weight: 500; }
  #controls {
    position: fixed; bottom: 16px; left: 16px;
    padding: 12px 16px;
    background: var(--hud-bg);
    border: 1px solid var(--hud-border);
    border-radius: 12px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    font-size: 12px; line-height: 1.7;
    pointer-events: none; z-index: 10;
  }
  #controls .key {
    display: inline-block;
    padding: 1px 6px;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 4px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11px; margin: 0 2px;
  }
  #weather-bar {
    position: fixed; top: 16px; right: 16px;
    display: flex; gap: 6px;
    background: var(--hud-bg);
    border: 1px solid var(--hud-border);
    border-radius: 12px; padding: 6px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    z-index: 10;
  }
  #weather-bar button {
    background: transparent; border: 1px solid transparent;
    color: var(--hud-fg); padding: 6px 12px;
    font-size: 12px; border-radius: 8px; cursor: pointer;
    font-family: inherit;
    transition: background 0.15s, border-color 0.15s;
  }
  #weather-bar button:hover { background: rgba(255,255,255,0.06); }
  #weather-bar button.active {
    background: rgba(255, 184, 107, 0.18);
    border-color: var(--hud-accent); color: var(--hud-accent);
  }
  #time-bar {
    position: fixed; top: 16px; left: 50%;
    transform: translateX(-50%);
    width: 260px;
    background: var(--hud-bg);
    border: 1px solid var(--hud-border);
    border-radius: 12px; padding: 10px 14px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    z-index: 10;
  }
  #time-track {
    position: relative; height: 6px;
    background: linear-gradient(to right, #0a1a3a, #ff8a5b 25%, #87ceeb 50%, #ff8a5b 75%, #0a1a3a);
    border-radius: 3px; margin-bottom: 6px;
  }
  #time-marker {
    position: absolute; top: -3px;
    width: 12px; height: 12px;
    background: #fff; border-radius: 50%;
    transform: translateX(-50%);
    box-shadow: 0 0 8px rgba(255,255,255,0.8);
    transition: left 0.1s linear;
  }
  #time-label {
    font-size: 11px; text-align: center; opacity: 0.85;
    font-variant-numeric: tabular-nums;
  }
  #start-screen {
    position: fixed; inset: 0;
    background: radial-gradient(ellipse at center, rgba(20,30,50,0.85), rgba(0,0,0,0.95));
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 100; cursor: pointer;
    transition: opacity 0.5s;
  }
  #start-screen.hidden { opacity: 0; pointer-events: none; }
  #start-screen h1 {
    font-size: 56px; font-weight: 200; letter-spacing: 4px;
    margin-bottom: 8px; color: #fff;
  }
  #start-screen .sub {
    font-size: 14px; opacity: 0.6; letter-spacing: 6px;
    text-transform: uppercase; margin-bottom: 48px;
  }
  #start-screen .start-btn {
    padding: 14px 40px;
    background: rgba(255, 184, 107, 0.15);
    border: 1px solid var(--hud-accent); color: var(--hud-accent);
    border-radius: 30px; font-size: 14px; letter-spacing: 2px;
    text-transform: uppercase; transition: all 0.2s;
  }
  #start-screen .start-btn:hover {
    background: rgba(255, 184, 107, 0.25); transform: scale(1.05);
  }
  #start-screen .hint { margin-top: 24px; font-size: 12px; opacity: 0.5; }
  .flash { animation: flash 0.3s ease-out; }
  @keyframes flash {
    0% { background: rgba(255, 93, 108, 0.4); }
    100% { background: var(--hud-bg); }
  }
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<div id="start-screen">
  <h1>SKY</h1>
  <div class="sub">Ride the open world · v2</div>
  <div class="start-btn">Click to ride</div>
  <div class="hint">Click anywhere to start · ESC to release mouse</div>
</div>

<div id="hud">
  <h1>SKY · RIDER</h1>
  <div class="row"><span class="label">Speed</span><span class="value" id="hud-speed">0.0</span></div>
  <div class="row"><span class="label">Biome</span><span class="value" id="hud-biome">—</span></div>
  <div class="row"><span class="label">Altitude</span><span class="value" id="hud-alt">0 m</span></div>
  <div class="row"><span class="label">FPS</span><span class="value" id="hud-fps">0</span></div>
</div>

<div id="time-bar">
  <div id="time-track">
    <div id="time-marker" style="left: 50%;"></div>
  </div>
  <div id="time-label">12:00</div>
</div>

<div id="weather-bar">
  <button data-weather="clear" class="active">☀ Clear</button>
  <button data-weather="rain">🌧 Rain</button>
  <button data-weather="snow">❄ Snow</button>
  <button data-weather="fog">🌫 Fog</button>
</div>

<div id="controls">
  <div><span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span> ride</div>
  <div><span class="key">Mouse</span> look · <span class="key">Shift</span> gallop · <span class="key">Space</span> jump</div>
  <div><span class="key">E</span> / <span class="key">Q</span> time · <span class="key">1-4</span> weather · <span class="key">R</span> reset</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { Reflector } from 'three/addons/objects/Reflector.js';
import * as BufferGeometryUtils from 'three/addons/utils/BufferGeometryUtils.js';

/* =============================================================
   CONFIG & STATE
   ============================================================= */
const WORLD = 800;
const TERRAIN_SEG = 220;
const SEED = 1337;

const state = {
  timeOfDay: 12,
  timeScale: 0.4,
  weather: 'clear',
  weatherIntensity: 1.0,
  speed: 0,
  gallop: 0,
  isGrounded: true,
  velocityY: 0,
  yaw: 0,
  pitch: 0,
  pointerLocked: false,
  fpsAcc: 0, fpsCount: 0, fpsLast: performance.now(),
  horseMode: 'box',       // 'box' | 'glb'
};

/* =============================================================
   DETERMINISTIC RNG + NOISE
   ============================================================= */
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rng = mulberry32(SEED);

function hash2(x, y) {
  const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453;
  return s - Math.floor(s);
}
function smoothNoise2(x, y) {
  const ix = Math.floor(x), iy = Math.floor(y);
  const fx = x - ix, fy = y - iy;
  const ux = fx * fx * (3 - 2 * fx);
  const uy = fy * fy * (3 - 2 * fy);
  const a = hash2(ix, iy);
  const b = hash2(ix + 1, iy);
  const c = hash2(ix, iy + 1);
  const d = hash2(ix + 1, iy + 1);
  return a * (1 - ux) * (1 - uy) + b * ux * (1 - uy) + c * (1 - ux) * uy + d * ux * uy;
}
function fbm(x, y, octaves = 5, lacunarity = 2.0, gain = 0.5) {
  let v = 0, amp = 1, freq = 1, total = 0;
  for (let i = 0; i < octaves; i++) {
    v += amp * smoothNoise2(x * freq, y * freq);
    total += amp;
    amp *= gain;
    freq *= lacunarity;
  }
  return v / total;
}

/* =============================================================
   TERRAIN HEIGHT / BIOME (deterministic, callable anywhere)
   ============================================================= */
function heightAt(x, z) {
  const baseScale = 0.0035;
  const base = fbm(x * baseScale, z * baseScale, 5);
  const mMask = fbm(x * 0.0006 + 100, z * 0.0006 + 100, 3);
  const mountainRidge = fbm(x * 0.0015 + 200, z * 0.0015 + 200, 6);
  const mountainAmount = Math.pow(Math.max(0, mMask - 0.45), 1.4) * 3.5;
  const detail = fbm(x * 0.02 + 500, z * 0.02 + 500, 3) * 0.5;
  const sea = -2;
  return base * 18 + mountainRidge * mountainAmount * 75 + detail * 0.8 + sea;
}
function moistureAt(x, z) {
  return fbm(x * 0.003 + 777, z * 0.003 + 777, 4);
}
function slopeAt(x, z) {
  const e = 0.5;
  const h = heightAt(x, z);
  const hx = heightAt(x + e, z);
  const hz = heightAt(x, z + e);
  return Math.sqrt((hx - h) ** 2 + (hz - h) ** 2) / e;
}
function biomeAt(x, z) {
  const h = heightAt(x, z);
  if (h < 0) return { name: 'water', tint: [0.20, 0.40, 0.62] };
  if (h > 75) return { name: 'snow', tint: [0.95, 0.97, 1.00] };
  if (h > 50) return { name: 'rock', tint: [0.45, 0.42, 0.40] };
  const m = moistureAt(x, z);
  const s = slopeAt(x, z);
  if (s > 0.7) return { name: 'rock', tint: [0.50, 0.46, 0.42] };
  if (m > 0.58 && h < 45) return { name: 'forest', tint: [0.22, 0.40, 0.20] };
  if (m < 0.35) return { name: 'savanna', tint: [0.55, 0.55, 0.30] };
  return { name: 'grass', tint: [0.35, 0.52, 0.28] };
}
