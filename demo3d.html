<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>远风归途 · 3D 开放世界试玩</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Noto+Serif+SC:wght@600&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --hud-bg: rgba(20, 16, 12, 0.78);
    --hud-border: rgba(212, 168, 83, 0.28);
    --hud-fg: #e8dcc8;
    --hud-accent: #d4a853;
    --hud-warn: #c47840;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%; overflow: hidden; background: #000;
    font-family: 'Source Sans 3', 'Noto Sans SC', sans-serif;
    color: var(--hud-fg); user-select: none; -webkit-user-select: none;
  }
  #canvas { display: block; width: 100vw; height: 100vh; cursor: crosshair; }
  #hud {
    position: fixed; top: 16px; left: 16px; padding: 14px 18px;
    background: var(--hud-bg); border: 1px solid var(--hud-border);
    border-radius: 12px; backdrop-filter: blur(10px);
    min-width: 220px; font-size: 13px; line-height: 1.7;
    pointer-events: none; z-index: 10;
  }
  #hud h1 {
    font-family: 'Noto Serif SC', serif; font-size: 14px; font-weight: 600;
    margin-bottom: 8px; color: var(--hud-accent); letter-spacing: 1px;
  }
  #hud .row { display: flex; justify-content: space-between; gap: 16px; }
  #hud .label { opacity: 0.65; }
  #hud .value { font-variant-numeric: tabular-nums; font-weight: 500; }
  .bar-row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .bar-row .bl { width: 28px; font-size: 11px; opacity: 0.7; }
  .bar-track { flex: 1; height: 6px; background: rgba(0,0,0,0.35); border-radius: 3px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 3px; transition: width 0.2s; }
  #controls {
    position: fixed; bottom: 16px; left: 16px; padding: 12px 16px;
    background: var(--hud-bg); border: 1px solid var(--hud-border);
    border-radius: 12px; backdrop-filter: blur(10px);
    font-size: 12px; line-height: 1.7; pointer-events: none; z-index: 10;
  }
  #controls .key {
    display: inline-block; padding: 1px 6px;
    background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.18);
    border-radius: 4px; font-family: ui-monospace, Menlo, monospace;
    font-size: 11px; margin: 0 2px; color: var(--hud-accent);
  }
  #weather-bar {
    position: fixed; top: 16px; right: 16px; display: flex; gap: 6px;
    background: var(--hud-bg); border: 1px solid var(--hud-border);
    border-radius: 12px; padding: 6px; backdrop-filter: blur(10px); z-index: 10;
  }
  #weather-bar button {
    background: transparent; border: 1px solid transparent;
    color: var(--hud-fg); padding: 6px 12px; font-size: 12px;
    border-radius: 8px; cursor: pointer; font-family: inherit;
  }
  #weather-bar button:hover { background: rgba(255,255,255,0.06); }
  #weather-bar button.active {
    background: rgba(212,168,83,0.18); border-color: var(--hud-accent); color: var(--hud-accent);
  }
  #time-bar {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
    width: 260px; background: var(--hud-bg); border: 1px solid var(--hud-border);
    border-radius: 12px; padding: 10px 14px; backdrop-filter: blur(10px); z-index: 10;
  }
  #time-track {
    position: relative; height: 6px;
    background: linear-gradient(to right, #0a1a3a, #ff8a5b 25%, #87ceeb 50%, #ff8a5b 75%, #0a1a3a);
    border-radius: 3px; margin-bottom: 6px;
  }
  #time-marker {
    position: absolute; top: -3px; width: 12px; height: 12px;
    background: #fff; border-radius: 50%; transform: translateX(-50%);
    box-shadow: 0 0 8px rgba(255,255,255,0.8);
  }
  #time-label { font-size: 11px; text-align: center; opacity: 0.85; font-variant-numeric: tabular-nums; }
  #start-screen {
    position: fixed; inset: 0;
    background: radial-gradient(ellipse at center, rgba(40,28,16,0.9), rgba(0,0,0,0.97));
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 100; cursor: pointer; transition: opacity 0.5s;
  }
  #start-screen.hidden { opacity: 0; pointer-events: none; }
  #start-screen h1 {
    font-family: 'Cinzel', 'Noto Serif SC', serif;
    font-size: clamp(2.5rem, 6vw, 4rem); font-weight: 600;
    letter-spacing: 8px; margin-bottom: 8px; color: #e8c878;
  }
  #start-screen .sub {
    font-size: 14px; opacity: 0.7; letter-spacing: 4px; margin-bottom: 16px; color: #e8dcc8;
  }
  #start-screen .rating {
    font-size: 12px; color: #a8c49a; margin-bottom: 40px;
    padding: 4px 14px; border: 1px solid rgba(107,124,94,0.4); border-radius: 20px;
  }
  #start-screen .start-btn {
    padding: 14px 40px; background: rgba(212,168,83,0.15);
    border: 1px solid var(--hud-accent); color: var(--hud-accent);
    border-radius: 30px; font-size: 14px; letter-spacing: 2px; transition: all 0.2s;
  }
  #start-screen .start-btn:hover { background: rgba(212,168,83,0.28); transform: scale(1.04); }
  #start-screen .hint { margin-top: 24px; font-size: 12px; opacity: 0.5; }
  #start-screen .back {
    position: absolute; top: 20px; left: 20px; color: rgba(232,220,200,0.6);
    text-decoration: none; font-size: 0.85rem; padding: 8px 16px;
    border: 1px solid rgba(212,168,83,0.25); border-radius: 8px;
  }
  #start-screen .back:hover { color: #e8c878; }
  #prompt {
    position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
    background: var(--hud-bg); border: 1px solid var(--hud-border);
    padding: 10px 20px; border-radius: 10px; font-size: 13px;
    z-index: 20; display: none; pointer-events: none;
  }
  #prompt .ekey {
    display: inline-block; padding: 2px 8px; margin-right: 8px;
    background: rgba(212,168,83,0.2); border: 1px solid var(--hud-accent);
    border-radius: 4px; color: var(--hud-accent); font-weight: 600;
  }
  #dialogue {
    position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
    width: min(640px, 90vw); background: rgba(20,16,12,0.94);
    border: 1px solid var(--hud-border); border-radius: 14px;
    padding: 22px 26px; z-index: 50; display: none; backdrop-filter: blur(12px);
  }
  #dialogue .speaker { color: var(--hud-accent); font-family: 'Noto Serif SC', serif; margin-bottom: 8px; font-size: 0.95rem; }
  #dialogue .text { font-size: 0.92rem; line-height: 1.7; color: var(--hud-fg); margin-bottom: 14px; }
  #dialogue .choices { display: flex; flex-direction: column; gap: 8px; }
  #dialogue .choices button {
    text-align: left; padding: 10px 14px; background: rgba(212,168,83,0.08);
    border: 1px solid var(--hud-border); border-radius: 8px; color: var(--hud-fg);
    font-family: inherit; cursor: pointer; font-size: 0.88rem;
  }
  #dialogue .choices button:hover { background: rgba(212,168,83,0.18); border-color: var(--hud-accent); }
  #dialogue .continue { font-size: 0.78rem; opacity: 0.5; text-align: right; }
  #quest-tracker {
    position: fixed; top: 90px; right: 16px; width: 240px;
    background: var(--hud-bg); border: 1px solid var(--hud-border);
    border-radius: 12px; padding: 14px; z-index: 10; display: none;
    backdrop-filter: blur(10px); font-size: 12px;
  }
  #quest-tracker h3 { color: var(--hud-accent); font-size: 12px; margin-bottom: 8px; letter-spacing: 1px; }
  #quest-tracker .qtitle { font-weight: 600; margin-bottom: 4px; }
  #quest-tracker .qdesc { opacity: 0.7; line-height: 1.5; }
  #toast {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    background: rgba(20,16,12,0.92); border: 1px solid var(--hud-border);
    padding: 14px 28px; border-radius: 10px; z-index: 60; display: none;
    font-size: 14px; color: var(--hud-accent); pointer-events: none;
  }
  .flash { animation: flash 0.3s ease-out; }
  @keyframes flash {
    0% { background: rgba(212, 168, 83, 0.35); }
    100% { background: var(--hud-bg); }
  }
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<div id="start-screen">
  <a class="back" href="index.html" onclick="event.stopPropagation()">← 返回设计文档</a>
  <h1>远风归途</h1>
  <div class="sub">Distant Wind · 3D Open World</div>
  <div class="rating">12+ 休闲冒险 · 零战斗 · 骑马探索</div>
  <div class="start-btn">点击开始骑行</div>
  <div class="hint">点击锁定鼠标 · ESC 释放 · E 与营地互动</div>
</div>

<div id="hud">
  <h1>远风归途 · 伊莱</h1>
  <div class="row"><span class="label">速度</span><span class="value" id="hud-speed">0.0</span></div>
  <div class="row"><span class="label">地貌</span><span class="value" id="hud-biome">—</span></div>
  <div class="row"><span class="label">海拔</span><span class="value" id="hud-alt">0 m</span></div>
  <div class="row"><span class="label">声望</span><span class="value" id="hud-rep">0</span></div>
  <div style="margin-top:10px;border-top:1px solid rgba(212,168,83,0.15);padding-top:8px">
    <div class="bar-row"><span class="bl">体力</span><div class="bar-track"><div class="bar-fill" id="bar-sta" style="width:100%;background:#6b9e5a"></div></div></div>
    <div class="bar-row"><span class="bl">饱腹</span><div class="bar-track"><div class="bar-fill" id="bar-hun" style="width:80%;background:#d4a853"></div></div></div>
    <div class="bar-row"><span class="bl">温暖</span><div class="bar-track"><div class="bar-fill" id="bar-wrm" style="width:70%;background:#c47840"></div></div></div>
  </div>
</div>

<div id="time-bar">
  <div id="time-track"><div id="time-marker" style="left:50%"></div></div>
  <div id="time-label">12:00</div>
</div>

<div id="weather-bar">
  <button data-weather="clear" class="active">☀ 晴</button>
  <button data-weather="rain">🌧 雨</button>
  <button data-weather="snow">❄ 雪</button>
  <button data-weather="fog">🌫 雾</button>
</div>

<div id="quest-tracker">
  <h3>📜 当前任务</h3>
  <div class="qtitle" id="q-title">—</div>
  <div class="qdesc" id="q-desc">靠近晨曦旅社营地，与艾琳交谈。</div>
</div>

<div id="controls">
  <div><span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span> 骑行 · <span class="key">Shift</span> 疾驰 · <span class="key">Space</span> 跨越</div>
  <div><span class="key">E</span> 互动 · <span class="key">F</span>/<span class="key">G</span> 调时 · <span class="key">1-4</span> 天气 · <span class="key">R</span> 回营</div>
  <div><span class="key">鼠标</span> 环视 · <span class="key">ESC</span> 释放鼠标</div>
</div>

<div id="prompt"><span class="ekey">E</span><span id="prompt-text">互动</span></div>
<div id="dialogue">
  <div class="speaker" id="dlg-speaker"></div>
  <div class="text" id="dlg-text"></div>
  <div class="choices" id="dlg-choices"></div>
  <div class="continue" id="dlg-continue">按 E 继续</div>
</div>
<div id="toast"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { Reflector } from 'three/addons/objects/Reflector.js';
import * as BufferGeometryUtils from 'three/addons/utils/BufferGeometryUtils.js';

/* =============================================================
   CONFIG & STATE
   ============================================================= */
const WORLD = 800;
const TERRAIN_SEG = 220;
const SEED = 1337;

const state = {
  timeOfDay: 12,
  timeScale: 0.4,
  weather: 'clear',
  weatherIntensity: 1.0,
  speed: 0,
  gallop: 0,
  isGrounded: true,
  velocityY: 0,
  yaw: 0,
  pitch: 0,
  pointerLocked: false,
  fpsAcc: 0, fpsCount: 0, fpsLast: performance.now(),
  horseMode: 'box',       // 'box' | 'glb'
};

/* =============================================================
   DETERMINISTIC RNG + NOISE
   ============================================================= */
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rng = mulberry32(SEED);

function hash2(x, y) {
  const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453;
  return s - Math.floor(s);
}
function smoothNoise2(x, y) {
  const ix = Math.floor(x), iy = Math.floor(y);
  const fx = x - ix, fy = y - iy;
  const ux = fx * fx * (3 - 2 * fx);
  const uy = fy * fy * (3 - 2 * fy);
  const a = hash2(ix, iy);
  const b = hash2(ix + 1, iy);
  const c = hash2(ix, iy + 1);
  const d = hash2(ix + 1, iy + 1);
  return a * (1 - ux) * (1 - uy) + b * ux * (1 - uy) + c * (1 - ux) * uy + d * ux * uy;
}
function fbm(x, y, octaves = 5, lacunarity = 2.0, gain = 0.5) {
  let v = 0, amp = 1, freq = 1, total = 0;
  for (let i = 0; i < octaves; i++) {
    v += amp * smoothNoise2(x * freq, y * freq);
    total += amp;
    amp *= gain;
    freq *= lacunarity;
  }
  return v / total;
}

/* =============================================================
   TERRAIN HEIGHT / BIOME (deterministic, callable anywhere)
   ============================================================= */
function heightAt(x, z) {
  const baseScale = 0.0035;
  const base = fbm(x * baseScale, z * baseScale, 5);
  const mMask = fbm(x * 0.0006 + 100, z * 0.0006 + 100, 3);
  const mountainRidge = fbm(x * 0.0015 + 200, z * 0.0015 + 200, 6);
  const mountainAmount = Math.pow(Math.max(0, mMask - 0.45), 1.4) * 3.5;
  const detail = fbm(x * 0.02 + 500, z * 0.02 + 500, 3) * 0.5;
  const sea = -2;
  return base * 18 + mountainRidge * mountainAmount * 75 + detail * 0.8 + sea;
}
function moistureAt(x, z) {
  return fbm(x * 0.003 + 777, z * 0.003 + 777, 4);
}
function slopeAt(x, z) {
  const e = 0.5;
  const h = heightAt(x, z);
  const hx = heightAt(x + e, z);
  const hz = heightAt(x, z + e);
  return Math.sqrt((hx - h) ** 2 + (hz - h) ** 2) / e;
}
function biomeAt(x, z) {
  const h = heightAt(x, z);
  if (h < 0) return { name: 'water', tint: [0.20, 0.40, 0.62] };
  if (h > 75) return { name: 'snow', tint: [0.95, 0.97, 1.00] };
  if (h > 50) return { name: 'rock', tint: [0.45, 0.42, 0.40] };
  const m = moistureAt(x, z);
  const s = slopeAt(x, z);
  if (s > 0.7) return { name: 'rock', tint: [0.50, 0.46, 0.42] };
  if (m > 0.58 && h < 45) return { name: 'forest', tint: [0.22, 0.40, 0.20] };
  if (m < 0.35) return { name: 'savanna', tint: [0.55, 0.55, 0.30] };
  return { name: 'grass', tint: [0.35, 0.52, 0.28] };
}

/* =============================================================
   THREE.JS SETUP
   ============================================================= */
const canvas = document.getElementById('canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0xa6c8e8, 0.0018);

const camera = new THREE.PerspectiveCamera(72, window.innerWidth / window.innerHeight, 0.5, 1500);
camera.position.set(0, 30, 50);

/* HDR environment lighting (RoomEnvironment → PMREM) */
{
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
  pmrem.dispose();
}

/* =============================================================
   LIGHTING
   ============================================================= */
const sun = new THREE.DirectionalLight(0xffeec0, 1.2);
sun.position.set(100, 100, 50);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 400;
sun.shadow.camera.left = -120;
sun.shadow.camera.right = 120;
sun.shadow.camera.top = 120;
sun.shadow.camera.bottom = -120;
sun.shadow.bias = -0.0005;
scene.add(sun);

const ambient = new THREE.AmbientLight(0x6688aa, 0.35);
scene.add(ambient);

const hemi = new THREE.HemisphereLight(0x88aaff, 0x443322, 0.25);
scene.add(hemi);

/* =============================================================
   SKY (gradient + sun + procedural fbm clouds)
   ============================================================= */
const skyGeo = new THREE.SphereGeometry(800, 32, 16);
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide,
  uniforms: {
    uTime: { value: 0 },
    uSunDir: { value: new THREE.Vector3(0, 1, 0) },
    uSunColor: { value: new THREE.Color(0xfff1c0) },
    uZenith: { value: new THREE.Color(0x4a78c8) },
    uHorizon: { value: new THREE.Color(0xc8d8e8) },
    uCloudCover: { value: 0.45 },   // 0 = none, 1 = overcast
    uCloudDark: { value: 0.0 },     // 0 = white clouds, 1 = storm
  },
  vertexShader: /* glsl */`
    varying vec3 vWorldPos;
    void main() {
      vec4 wp = modelMatrix * vec4(position, 1.0);
      vWorldPos = wp.xyz;
      gl_Position = projectionMatrix * viewMatrix * wp;
    }
  `,
  fragmentShader: /* glsl */`
    uniform float uTime;
    uniform vec3 uSunDir;
    uniform vec3 uSunColor;
    uniform vec3 uZenith;
    uniform vec3 uHorizon;
    uniform float uCloudCover;
    uniform float uCloudDark;
    varying vec3 vWorldPos;

    float chash(vec2 p) {
      return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
    }
    float cnoise(vec2 p) {
      vec2 i = floor(p), f = fract(p);
      vec2 u = f * f * (3.0 - 2.0 * f);
      float a = chash(i);
      float b = chash(i + vec2(1.0, 0.0));
      float c = chash(i + vec2(0.0, 1.0));
      float d = chash(i + vec2(1.0, 1.0));
      return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
    }
    float cfbm(vec2 p) {
      float v = 0.0, amp = 0.55;
      for (int i = 0; i < 5; i++) {
        v += amp * cnoise(p);
        p = p * 2.03 + vec2(19.7, 7.3);
        amp *= 0.5;
      }
      return v;
    }

    void main() {
      vec3 dir = normalize(vWorldPos);
      float h = clamp(dir.y, 0.0, 1.0);
      vec3 sky = mix(uHorizon, uZenith, pow(h, 0.55));
      vec3 sunDirN = normalize(uSunDir);
      float sunDot = max(0.0, dot(dir, sunDirN));
      vec3 glow = uSunColor * pow(sunDot, 32.0) * 1.4;
      float horizonGlow = pow(1.0 - abs(dir.y), 4.0) * pow(sunDot, 2.0);
      sky += uSunColor * horizonGlow * 0.3;

      // Procedural clouds, projected onto a virtual plane above the horizon
      if (dir.y > 0.015) {
        vec2 cuv = dir.xz / (dir.y + 0.18) * 1.35;
        cuv += vec2(uTime * 0.008, uTime * 0.003);
        float c = cfbm(cuv * 0.9);
        // detail pass erodes edges → soft, broken clouds
        float d = cfbm(cuv * 2.7 + vec2(31.4, 17.2) + uTime * 0.004);
        c = c * 0.75 + d * 0.25;
        float thresh = 1.0 - uCloudCover * 0.85;
        float cl = smoothstep(thresh, thresh + 0.28, c);
        float fade = smoothstep(0.015, 0.12, dir.y);
        // lighting: white toward sun / noon, pink at low sun, grey when dark
        float sunHeight = clamp(sunDirN.y, 0.0, 1.0);
        vec3 litCol = mix(vec3(1.0, 0.72, 0.62), vec3(1.0, 1.0, 1.0), smoothstep(0.0, 0.45, sunHeight));
        vec3 shadeCol = mix(litCol * 0.55, vec3(0.32, 0.34, 0.40), uCloudDark);
        litCol = mix(litCol, vec3(0.55, 0.58, 0.65), uCloudDark * 0.7);
        float shading = cfbm(cuv * 1.7 + vec2(5.2, 9.1));
        vec3 cloudCol = mix(shadeCol, litCol, smoothstep(0.3, 0.75, shading) * (0.35 + 0.65 * sunDot));
        // clouds dim at night
        cloudCol *= 0.12 + 0.88 * smoothstep(-0.05, 0.25, sunDirN.y);
        sky = mix(sky, cloudCol, cl * fade * 0.92);
        // silver lining near sun
        sky += uSunColor * cl * fade * pow(sunDot, 6.0) * 0.35 * (1.0 - uCloudDark);
      }

      if (dir.y < 0.0) {
        sky = mix(uHorizon * 0.4, sky, clamp(1.0 + dir.y * 4.0, 0.0, 1.0));
      }

/* =============================================================
   PROCEDURAL GROUND TEXTURES (CanvasTexture, no external images)
   ============================================================= */
function makeGroundDetailTexture(size = 512) {
  const cv = document.createElement('canvas');
  cv.width = cv.height = size;
  const ctx = cv.getContext('2d');
  const img = ctx.createImageData(size, size);
  const data = img.data;
  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      // tileable-ish multi-octave value noise, mostly luminance detail
      const u = x / size, v = y / size;
      let n = 0, amp = 0.6, fr = 6;
      for (let o = 0; o < 4; o++) {
        n += amp * smoothNoise2(u * fr, v * fr);
        amp *= 0.5; fr *= 2.1;
      }
      // blades / grain: high-frequency streaks
      const grain = smoothNoise2(u * 90, v * 190) * 0.25;
      let lum = 0.72 + (n - 0.5) * 0.45 + (grain - 0.125);
      lum = Math.max(0.35, Math.min(1.05, lum));
      // slight warm/green tint variation
      const tint = smoothNoise2(u * 14 + 40, v * 14 + 40);
      const i = (y * size + x) * 4;
      data[i+0] = Math.min(255, lum * 255 * (0.94 + tint * 0.10));
      data[i+1] = Math.min(255, lum * 255 * (1.00));
      data[i+2] = Math.min(255, lum * 255 * (0.90 + tint * 0.06));
      data[i+3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  const tex = new THREE.CanvasTexture(cv);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(90, 90);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 4;
  return tex;
}
function makeGroundBumpTexture(size = 256) {
  const cv = document.createElement('canvas');
  cv.width = cv.height = size;
  const ctx = cv.getContext('2d');
  const img = ctx.createImageData(size, size);
  const data = img.data;
  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      const u = x / size, v = y / size;
      let n = fbm(u * 10, v * 10, 4);
      n += smoothNoise2(u * 60, v * 60) * 0.3;
      const g = Math.max(0, Math.min(255, n * 220));
      const i = (y * size + x) * 4;
      data[i] = data[i+1] = data[i+2] = g;
      data[i+3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  const tex = new THREE.CanvasTexture(cv);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(90, 90);
  return tex;
}

   TERRAIN MESH

function buildTerrain() {
  const geo = new THREE.PlaneGeometry(WORLD, WORLD, TERRAIN_SEG, TERRAIN_SEG);
  geo.rotateX(-Math.PI / 2);
  const pos = geo.attributes.position;
  const colors = new Float32Array(pos.count * 3);
  const tmpColor = new THREE.Color();

  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i);
    const z = pos.getZ(i);
    const h = heightAt(x, z);
    pos.setY(i, h);
    const b = biomeAt(x, z);
    const noise = (hash2(x * 0.1, z * 0.1) - 0.5) * 0.12;
    tmpColor.setRGB(
      Math.max(0, Math.min(1, b.tint[0] + noise)),
      Math.max(0, Math.min(1, b.tint[1] + noise)),
      Math.max(0, Math.min(1, b.tint[2] + noise))
    );
    colors[i*3+0] = tmpColor.r;
    colors[i*3+1] = tmpColor.g;
    colors[i*3+2] = tmpColor.b;
  }
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  geo.computeVertexNormals();

  const mat = new THREE.MeshStandardMaterial({
    vertexColors: true,
    map: makeGroundDetailTexture(),
    bumpMap: makeGroundBumpTexture(),
    bumpScale: 0.6,
    roughness: 0.93,
    metalness: 0.0,
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.receiveShadow = true;
  return mesh;
}

/* =============================================================
   WIND (shared uniform + vertex-sway injection for instanced flora)
   ============================================================= */
const windUniform = { value: 0 };

function addWindSway(material, amp, refHeight) {
  material.onBeforeCompile = (sh) => {
    sh.uniforms.uWindTime = windUniform;
    sh.vertexShader = 'uniform float uWindTime;\n' + sh.vertexShader.replace(
      '#include <begin_vertex>',
      `#include <begin_vertex>
      {
        float swayW = smoothstep(0.5, ${refHeight.toFixed(1)}, transformed.y);
        #ifdef USE_INSTANCING
          float ph = instanceMatrix[3][0] * 0.35 + instanceMatrix[3][2] * 0.41;
        #else
          float ph = 0.0;
        #endif
        transformed.x += sin(uWindTime * 1.4 + ph) * ${amp.toFixed(3)} * swayW;
        transformed.z += cos(uWindTime * 1.1 + ph * 1.3) * ${(amp * 0.7).toFixed(3)} * swayW;
      }`
    );
  };
  return material;
}

/* =============================================================
   FLORA HELPERS — merged, vertex-colored tree geometries
   ============================================================= */
function coloredGeo(geo, hex, jitter = 0.06) {
  const g = geo.index ? geo.toNonIndexed() : geo;
  const n = g.attributes.position.count;
  const colors = new Float32Array(n * 3);
  const c = new THREE.Color(hex);
  for (let i = 0; i < n; i++) {
    const j = (rng() - 0.5) * jitter;
    colors[i*3+0] = Math.max(0, Math.min(1, c.r + j));
    colors[i*3+1] = Math.max(0, Math.min(1, c.g + j));
    colors[i*3+2] = Math.max(0, Math.min(1, c.b + j));
  }
  g.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  if (!g.attributes.uv) {
    g.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(n * 2), 2));
  }
  return g;
}
function xform(geo, x, y, z, s = 1, ry = 0) {
  geo.scale(s, s, s);
  if (ry) geo.rotateY(ry);
  geo.translate(x, y, z);
  return geo;
}

function buildPineGeo() {
  const parts = [];
  parts.push(coloredGeo(xform(new THREE.CylinderGeometry(0.22, 0.34, 4, 6), 0, 2, 0), 0x4a2e1c));
  for (let i = 0; i < 3; i++) {
    parts.push(coloredGeo(
      xform(new THREE.ConeGeometry(2.0 - i * 0.45, 2.4, 7), 0, 4 + i * 1.3, 0),
      i === 2 ? 0x3a7028 : 0x2d5a1e, 0.10
    ));
  }
  return BufferGeometryUtils.mergeGeometries(parts);
}
function buildOakGeo() {
  const parts = [];
  parts.push(coloredGeo(xform(new THREE.CylinderGeometry(0.28, 0.45, 3.4, 6), 0, 1.7, 0), 0x5a3d22));
  // leaf clusters
  const blobs = [
    [0, 4.6, 0, 2.2], [1.3, 3.9, 0.4, 1.4], [-1.2, 4.1, -0.5, 1.5], [0.2, 3.8, -1.2, 1.2], [-0.4, 4.0, 1.2, 1.3],
  ];
  for (const [x, y, z, s] of blobs) {
    parts.push(coloredGeo(xform(new THREE.IcosahedronGeometry(s, 1), x, y, z, 1, rng() * 3), 0x4a7a28, 0.12));
  }
  return BufferGeometryUtils.mergeGeometries(parts);
}
function buildBirchGeo() {
  const parts = [];
  parts.push(coloredGeo(xform(new THREE.CylinderGeometry(0.14, 0.2, 4.6, 6), 0, 2.3, 0), 0xe8e4da, 0.05));
  const blobs = [[0, 5.2, 0, 1.5], [0.7, 4.5, 0.3, 1.0], [-0.6, 4.7, -0.3, 0.9]];
  for (const [x, y, z, s] of blobs) {
    parts.push(coloredGeo(xform(new THREE.IcosahedronGeometry(s, 1), x, y, z, 1, rng() * 3), 0x9ec860, 0.12));
  }
  return BufferGeometryUtils.mergeGeometries(parts);
}

function placeInstancedGeo(geo, material, count, predicate, scaleRange = [0.8, 1.6], tint = null) {
  const inst = new THREE.InstancedMesh(geo, material, count);
  inst.castShadow = true;
  inst.receiveShadow = true;
  const dummy = new THREE.Object3D();
  const c = new THREE.Color();
  let placed = 0, attempts = 0;
  while (placed < count && attempts < count * 20) {
    attempts++;
    const x = (rng() - 0.5) * WORLD * 0.92;
    const z = (rng() - 0.5) * WORLD * 0.92;
    if (!predicate(x, z)) continue;
    const h = heightAt(x, z);
    if (h < 0) continue;
    dummy.position.set(x, h - 0.1, z);
    dummy.rotation.set(0, rng() * Math.PI * 2, 0);
    const s = scaleRange[0] + rng() * (scaleRange[1] - scaleRange[0]);
    dummy.scale.set(s, s, s);
    dummy.updateMatrix();
    inst.setMatrixAt(placed, dummy.matrix);
    if (tint) {
      c.setHSL(tint[0] + (rng() - 0.5) * 0.04, tint[1], tint[2] + (rng() - 0.5) * 0.08);
      inst.setColorAt(placed, c);
    }
    placed++;
  }
  inst.count = placed;
  inst.instanceMatrix.needsUpdate = true;
  if (inst.instanceColor) inst.instanceColor.needsUpdate = true;
  return inst;
}

function buildGrassGeo() {
  const blade = () => {
    const g = new THREE.PlaneGeometry(0.55, 1.0, 1, 2);
    g.translate(0, 0.5, 0);
    // pinch the top
    const p = g.attributes.position;
    for (let i = 0; i < p.count; i++) {
      const y = p.getY(i);
      p.setX(i, p.getX(i) * (1.0 - y * 0.75));
    }
    return g;
  };
  const a = blade();
  const b = blade(); b.rotateY(Math.PI / 2);
  const c = blade(); c.rotateY(Math.PI / 4);
  return coloredGeo(BufferGeometryUtils.mergeGeometries([a, b, c]), 0x7aa048, 0.15);
}

function buildCabin(x, z) {
  const group = new THREE.Group();
  const h = heightAt(x, z);
  group.position.set(x, h, z);

  const wallMat = new THREE.MeshStandardMaterial({ color: 0x6b4a2b, roughness: 0.95 });
  const roofMat = new THREE.MeshStandardMaterial({ color: 0x3a2a1a, roughness: 0.9 });

  const w = 4, d = 4, wallH = 2.5;
  const walls = new THREE.Mesh(new THREE.BoxGeometry(w, wallH, d), wallMat);
  walls.position.y = wallH / 2;
  walls.castShadow = true; walls.receiveShadow = true;
  group.add(walls);

  const roof = new THREE.Mesh(new THREE.ConeGeometry(Math.SQRT2 * w / 1.6, 2, 4), roofMat);
  roof.position.y = wallH + 1;
  roof.rotation.y = Math.PI / 4;
  roof.castShadow = true;
  group.add(roof);

  const door = new THREE.Mesh(new THREE.PlaneGeometry(0.8, 1.4),
    new THREE.MeshStandardMaterial({ color: 0x2a1a0a, roughness: 0.9 }));
  door.position.set(0, 0.7, d/2 + 0.01);
  group.add(door);

  const win = new THREE.Mesh(new THREE.PlaneGeometry(0.6, 0.6),
    new THREE.MeshStandardMaterial({ color: 0xfff1c0, emissive: 0x553311, emissiveIntensity: 0.4 }));
  win.position.set(-1.2, 1.4, d/2 + 0.01);
  group.add(win);

  const chimney = new THREE.Mesh(new THREE.BoxGeometry(0.5, 1.4, 0.5),
    new THREE.MeshStandardMaterial({ color: 0x4a3a2a, roughness: 0.95 }));
  chimney.position.set(1.2, wallH + 1.5, -0.5);
  chimney.castShadow = true;
  group.add(chimney);

  const smokeCount = 18;
  const smokeGeo = new THREE.BufferGeometry();
  const smokePos = new Float32Array(smokeCount * 3);
  for (let i = 0; i < smokeCount; i++) {
    smokePos[i*3+0] = 1.2;
    smokePos[i*3+1] = wallH + 2.2 + i * 0.6;
    smokePos[i*3+2] = -0.5;
  }
  smokeGeo.setAttribute('position', new THREE.BufferAttribute(smokePos, 3));
  const smoke = new THREE.Points(smokeGeo, new THREE.PointsMaterial({
    color: 0xcccccc, size: 1.2, transparent: true, opacity: 0.5, depthWrite: false,
  }));
  group.add(smoke);
  group.userData.smoke = smoke;
  group.userData.smokeBase = wallH + 2.2;

  return group;
}

  const legMat = new THREE.MeshStandardMaterial({ color: 0x3a2a1a, roughness: 0.85 });

    { x:  0.45, z: -0.85, name: 'br' }, { x: -0.45, z: -0.85, name: 'bl' },
  ];

const HORSE_GLB_URLS = [
  'https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/models/gltf/Horse.glb',
];
function tryLoadGLB(urls) {
  if (!urls.length) return; // keep box fallback
  const loader = new GLTFLoader();
  loader.load(urls[0], (gltf) => {
    const model = gltf.scene;
    // Normalize: back height ≈ 2.1, feet at y=0, centered
    const bbox = new THREE.Box3().setFromObject(model);
    const size = bbox.getSize(new THREE.Vector3());
    const scale = 2.1 / (size.y * 0.82); // back a bit below the head top
    model.scale.setScalar(scale);
    bbox.setFromObject(model);
    const center = bbox.getCenter(new THREE.Vector3());
    model.position.x -= center.x;
    model.position.z -= center.z;
    model.position.y -= bbox.min.y;
    model.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.frustumCulled = false; } });

    horseModel.remove(boxHorse);
    horseModel.add(model);
    state.horseMode = 'glb';
    positionRiderForGLB();

    mixer = new THREE.AnimationMixer(model);
    if (gltf.animations && gltf.animations.length) {
      glbAction = mixer.clipAction(gltf.animations[0]);
      glbAction.play();
      glbAction.timeScale = 0.0;
    }
  }, undefined, () => tryLoadGLB(urls.slice(1)));
}
tryLoadGLB(HORSE_GLB_URLS);

  head.position.set(0, 1.85, 0.85);
  head.rotation.x = Math.PI / 2 - 0.3;
  g.add(head);

  if (withAntlers) {
    for (let s of [-1, 1]) {
      const a1 = new THREE.Mesh(new THREE.ConeGeometry(0.035, 0.5, 4), darkFur);
      a1.position.set(s * 0.09, 2.15, 0.72);
      a1.rotation.z = s * 0.5;

      const a2 = new THREE.Mesh(new THREE.ConeGeometry(0.028, 0.3, 4), darkFur);
      a2.position.set(s * 0.2, 2.05, 0.72);
      a2.rotation.z = s * 1.0;

    }
  }
  const tail = new THREE.Mesh(new THREE.ConeGeometry(0.08, 0.25, 5),
    new THREE.MeshStandardMaterial({ color: 0xe8e0d0, roughness: 0.9 }));
  tail.position.set(0, 1.2, -0.75);
  tail.rotation.x = 2.6;
  g.add(tail);

  g.userData.legs = [];
  const legPos = [[0.18, 0.42], [-0.18, 0.42], [0.18, -0.42], [-0.18, -0.42]];
  for (const [lx, lz] of legPos) {
    const pivot = new THREE.Group();

    leg.position.y = -0.42;

function updateDeer(dt, t) {
  for (const deer of deerHerd) {
    const dx = deer.userData.target.x - deer.position.x;
    const dz = deer.userData.target.z - deer.position.z;
    const distT = Math.hypot(dx, dz);

    // flee from player
    const px = deer.position.x - horse.position.x;
    const pz = deer.position.z - horse.position.z;
    const distP = Math.hypot(px, pz);

    let targetSpeed = 0;
    let dirX = 0, dirZ = 0;
    if (distP < 28) {
      targetSpeed = 10;
      dirX = px / (distP || 1); dirZ = pz / (distP || 1);
    } else if (distT > 2) {
      targetSpeed = 2.2;
      dirX = dx / distT; dirZ = dz / distT;
    } else if (rng() < dt * 0.15) {
      // pick a new wander target nearby, stay in forest-ish area
      const nx = deer.position.x + (rng() - 0.5) * 60;
      const nz = deer.position.z + (rng() - 0.5) * 60;
      if (heightAt(nx, nz) > 0) deer.userData.target.set(nx, 0, nz);
    }

    deer.userData.speed += (targetSpeed - deer.userData.speed) * Math.min(1, dt * 3);
    if (deer.userData.speed > 0.05) {
      const targetYaw = Math.atan2(dirX, dirZ);
      let dy = targetYaw - deer.rotation.y;
      while (dy > Math.PI) dy -= Math.PI * 2;
      while (dy < -Math.PI) dy += Math.PI * 2;
      deer.rotation.y += dy * Math.min(1, dt * 5);
      deer.position.x += Math.sin(deer.rotation.y) * deer.userData.speed * dt;
      deer.position.z += Math.cos(deer.rotation.y) * deer.userData.speed * dt;
      deer.position.y = heightAt(deer.position.x, deer.position.z);
    }
    // leg trot
    const freq = 4 + deer.userData.speed * 1.2;
    const amp = Math.min(0.7, deer.userData.speed * 0.12);
    deer.userData.legs.forEach((leg, i) => {
      leg.rotation.x = Math.sin(t * freq + deer.userData.phase + (i % 2) * Math.PI) * amp;
    });
  }
}

/* Birds: 4 flocks circling the sky */
const birdFlocks = [];
function buildBird() {
  const g = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({ color: 0x2a2a30, roughness: 0.8, side: THREE.DoubleSide });
  const wingGeo = new THREE.BufferGeometry();
  wingGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array([
    0, 0, 0.18,   0, 0, -0.18,   0.85, 0, 0,
  ]), 3));
  wingGeo.computeVertexNormals();
  const wl = new THREE.Mesh(wingGeo, mat);
  const wr = new THREE.Mesh(wingGeo, mat);
  wr.scale.x = -1;
  g.add(wl); g.add(wr);
  g.userData.wings = [wl, wr];
  return g;
}
for (let f = 0; f < 4; f++) {
  const flock = new THREE.Group();
  const cx = (rng() - 0.5) * 500, cz = (rng() - 0.5) * 500;
  const alt = 55 + rng() * 40;
  const radius = 25 + rng() * 30;
  for (let b = 0; b < 5; b++) {
    const bird = buildBird();
    bird.userData.offset = b * (Math.PI * 2 / 5) + rng() * 0.4;
    bird.userData.r = radius + (rng() - 0.5) * 8;
    bird.userData.alt = alt + (rng() - 0.5) * 6;
    bird.userData.phase = rng() * 10;
    flock.add(bird);
  }
  flock.userData = { cx, cz, speed: 0.12 + rng() * 0.1, angle: rng() * Math.PI * 2 };
  scene.add(flock);
  birdFlocks.push(flock);
}
function updateBirds(dt, t) {
  for (const flock of birdFlocks) {
    flock.userData.angle += flock.userData.speed * dt;
    for (const bird of flock.children) {
      const a = flock.userData.angle + bird.userData.offset;
      const x = flock.userData.cx + Math.cos(a) * bird.userData.r;
      const z = flock.userData.cz + Math.sin(a) * bird.userData.r;
      bird.position.set(x, bird.userData.alt + Math.sin(t * 0.7 + bird.userData.phase) * 2, z);
      bird.rotation.y = -a;
      const flap = Math.sin(t * 9 + bird.userData.phase) * 0.7;
      bird.userData.wings[0].rotation.x = flap;
      bird.userData.wings[1].rotation.x = -flap;
    }
  }
}

/* =============================================================
   HORSE MOVEMENT & ANIMATION
   ============================================================= */
const startPos = new THREE.Vector3(48, 0, -28);
horse.position.copy(startPos);
horse.position.y = heightAt(startPos.x, startPos.z);

function updateHorse(dt) {
  if (!state.pointerLocked) {
    if (mixer) mixer.update(dt * 0.2); // idle graze pace on menu screen
    return;
  }

  const turnSpeed = 1.4;
  if (keys.a) state.yaw += turnSpeed * dt;
  if (keys.d) state.yaw -= turnSpeed * dt;

  const targetSpeed = (keys.w ? 1 : 0) - (keys.s ? 0.6 : 0);
  const maxSpeed = keys.shift ? 22 : 12;
  const accel = 8;
  state.speed += (targetSpeed * maxSpeed - state.speed) * Math.min(1, accel * dt);
  state.gallop += ((keys.shift && keys.w ? 1 : 0) - state.gallop) * Math.min(1, dt * 4);

  const fwd = new THREE.Vector3(Math.sin(state.yaw), 0, Math.cos(state.yaw));
  horse.position.x += fwd.x * state.speed * dt;
  horse.position.z += fwd.z * state.speed * dt;

  const groundY = heightAt(horse.position.x, horse.position.z);
  horse.position.y = groundY;

  let dy = state.yaw - horse.rotation.y;
  while (dy > Math.PI) dy -= Math.PI * 2;
  while (dy < -Math.PI) dy += Math.PI * 2;
  horse.rotation.y += dy * Math.min(1, dt * 8);

  // slope pitch so hooves follow terrain
  const ahead = heightAt(horse.position.x + fwd.x * 2, horse.position.z + fwd.z * 2);
  const slopePitch = Math.atan2(ahead - groundY, 2);
  horseModel.rotation.x += ((-slopePitch) - horseModel.rotation.x) * Math.min(1, dt * 5);

  if (jumpQueued && state.isGrounded) {
    state.velocityY = 14;
    state.isGrounded = false;
  }
  jumpQueued = false;
  if (!state.isGrounded) {
    state.velocityY -= 30 * dt;
    horse.position.y += state.velocityY * dt;
    if (horse.position.y <= groundY) {
      horse.position.y = groundY;
      state.velocityY = 0;
      state.isGrounded = true;
    }
  }

  const absSpeed = Math.abs(state.speed);

  if (state.horseMode === 'glb' && mixer && glbAction) {
    // gait-driven playback: still → walk → trot/canter → gallop
    const rate = absSpeed < 0.3 ? 0.0 : Math.max(0.35, absSpeed / 9);
    glbAction.timeScale += (rate - glbAction.timeScale) * Math.min(1, dt * 5);
    mixer.update(dt);
    // rider lean with speed
    rider.rotation.x += ((state.gallop * 0.18) - rider.rotation.x) * Math.min(1, dt * 4);
  } else if (boxHorse.parent) {
    const animT = performance.now() * 0.001;
    const legSpeed = 6 + state.gallop * 6;
    const legAmp = 0.6 + state.gallop * 0.4;
    const phases = { fr: 0, fl: Math.PI, br: Math.PI, bl: 0 };
    for (const leg of boxHorse.userData.legs) {
      leg.rotation.x = Math.sin(animT * legSpeed + phases[leg.userData.name]) * legAmp;
    }
    boxHorse.userData.parts.body.position.y = 2.4 + Math.abs(Math.sin(animT * legSpeed * 2)) * 0.05;
    boxHorse.userData.parts.head.position.y = 3.5 + Math.sin(animT * legSpeed * 2) * 0.04;
    boxHorse.userData.parts.tail.rotation.x = Math.sin(animT * 3) * 0.2;
    boxHorse.userData.parts.tail.rotation.z = Math.sin(animT * 5) * 0.15;
  }
}

/* =============================================================
   DAY / NIGHT
   ============================================================= */
const sunDir = new THREE.Vector3();
function updateDayNight(dt) {
  state.timeOfDay += state.timeScale * dt * (timeAdjust !== 0 ? 5 : 1) + timeAdjust * dt * 5;
  if (state.timeOfDay < 0) state.timeOfDay += 24;
  if (state.timeOfDay >= 24) state.timeOfDay -= 24;

  const t = state.timeOfDay / 24;
  const sunAngle = (state.timeOfDay - 6) / 24 * Math.PI * 2;
  sunDir.set(Math.cos(sunAngle), Math.sin(sunAngle), 0.3);

  const sunHeight = Math.max(0, Math.sin(sunAngle));
  const intensity = Math.max(0.05, sunHeight * 1.4);
  sun.intensity = intensity;
  sun.position.copy(sunDir).multiplyScalar(150);

  const dayZenith = new THREE.Color(0x4a78c8);
  const nightZenith = new THREE.Color(0x0a1230);
  const sunsetZenith = new THREE.Color(0x553355);
  const dayHorizon = new THREE.Color(0xc8d8e8);
  const nightHorizon = new THREE.Color(0x1a2540);
  const sunsetHorizon = new THREE.Color(0xff8a5b);

  const dayFactor = Math.max(0, Math.min(1, sunHeight * 1.5));
  const sunsetFactor = Math.max(0, 1 - Math.abs(state.timeOfDay - 18) / 3) * (1 - dayFactor);

  const zenith = nightZenith.clone().lerp(dayZenith, dayFactor).lerp(sunsetZenith, sunsetFactor);
  const horizon = nightHorizon.clone().lerp(dayHorizon, dayFactor).lerp(sunsetHorizon, sunsetFactor);

  skyMat.uniforms.uZenith.value.copy(zenith);
  skyMat.uniforms.uHorizon.value.copy(horizon);
  skyMat.uniforms.uSunDir.value.copy(sunDir);
  skyMat.uniforms.uSunColor.value.copy(new THREE.Color().lerpColors(
    new THREE.Color(0xff5530), new THREE.Color(0xfff1c0), dayFactor
  ));

  scene.fog.color.copy(horizon);
  if (state.weather === 'fog') {
    scene.fog.density = 0.012;
  } else {
    scene.fog.density = 0.0018 * (1 - dayFactor * 0.3) + sunsetFactor * 0.004;
  }
  renderer.setClearColor(horizon);

  ambient.intensity = 0.15 + dayFactor * 0.35;
  hemi.intensity = 0.1 + dayFactor * 0.3;
  hemi.color.setHex(dayFactor > 0.5 ? 0x88aaff : 0x445577);

  starMat.opacity = Math.max(0, 1 - dayFactor * 1.5) * 0.9;

  renderer.toneMappingExposure = 0.5 + dayFactor * 0.6 + sunsetFactor * 0.3;

  const hh = Math.floor(state.timeOfDay);
  const mm = Math.floor((state.timeOfDay - hh) * 60);
  document.getElementById('time-label').textContent =
    `${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}`;
  document.getElementById('time-marker').style.left = `${t * 100}%`;
}

/* =============================================================
   WEATHER UPDATE
   ============================================================= */
function updateWeather(dt) {
  // clouds drift toward weather target
  const wc = WEATHER_CLOUDS[state.weather];
  const cu = skyMat.uniforms;
  cu.uCloudCover.value += (wc.cover - cu.uCloudCover.value) * Math.min(1, dt * 0.8);
  cu.uCloudDark.value += (wc.dark - cu.uCloudDark.value) * Math.min(1, dt * 0.8);

  const pos = particles.geometry.attributes.position;
  const camPos = camera.position;
  const arr = pos.array;

  const isRain = state.weather === 'rain';
  const isSnow = state.weather === 'snow';
  const active = isRain || isSnow;

  particleMat.opacity = active ? (state.weatherIntensity * (isRain ? 0.7 : 0.9)) : 0;
  particleMat.color.setHex(isRain ? 0xaad4ff : 0xffffff);
  particleMat.size = isSnow ? 0.5 : 0.3;

  if (active) {
    const fallSpeed = isSnow ? 2.5 : 30;
    const drift = isSnow ? Math.sin(performance.now() * 0.001) * 0.3 : 0;
    for (let i = 0; i < PARTICLE_COUNT; i++) {
      arr[i*3+0] += drift * dt;
      arr[i*3+1] -= fallSpeed * dt;
      if (arr[i*3+1] < camPos.y - 5 || Math.abs(arr[i*3+0] - camPos.x) > 200 || Math.abs(arr[i*3+2] - camPos.z) > 200) {
        arr[i*3+0] = camPos.x + (rng() - 0.5) * 200;
        arr[i*3+1] = camPos.y + 80 + rng() * 40;
        arr[i*3+2] = camPos.z + (rng() - 0.5) * 200;
      }
    }
    pos.needsUpdate = true;
  }

  // chimney smoke
  villageGroup.children.forEach(cabin => {
    if (!cabin.userData.smoke) return;
    const sp = cabin.userData.smoke.geometry.attributes.position;
    for (let i = 0; i < sp.count; i++) {
      let y = sp.getY(i) + dt * (1.2 + i * 0.1);
      if (y > cabin.userData.smokeBase + 12) y = cabin.userData.smokeBase;
      sp.setY(i, y);
      sp.setX(i, 1.2 + (rng() - 0.5) * 0.4);
    }
    sp.needsUpdate = true;
  });
}

/* =============================================================
   HUD
   ============================================================= */
const hudSpeed = document.getElementById('hud-speed');
const hudBiome = document.getElementById('hud-biome');
const hudAlt = document.getElementById('hud-alt');
const hudFps = document.getElementById('hud-fps');

function updateHUD() {
  if (hudSpeed) hudSpeed.textContent = (Math.abs(state.speed)).toFixed(1);
  const b = biomeAt(horse.position.x, horse.position.z);
  const biomeLabel = (typeof BIOME_CN !== 'undefined' && BIOME_CN[b.name]) ? BIOME_CN[b.name] : b.name;
  if (hudBiome && hudBiome.textContent !== biomeLabel) {
    hudBiome.textContent = biomeLabel;
    document.getElementById('hud').classList.add('flash');
    setTimeout(() => document.getElementById('hud').classList.remove('flash'), 300);
  }
  if (hudAlt) hudAlt.textContent = `${horse.position.y.toFixed(0)} m`;

  state.fpsCount++;
  const now = performance.now();
  if (now - state.fpsLast > 500) {
    const fps = (state.fpsCount * 1000 / (now - state.fpsLast)) | 0;
    if (hudFps) hudFps.textContent = fps;
    state.fpsCount = 0;
    state.fpsLast = now;
  }
}

/* =============================================================
   MAIN LOOP
   ============================================================= */
let lastT = performance.now();
function animate(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  const t = now * 0.001;

  windUniform.value = t;
  updateHorse(dt);
  updateDeer(dt, t);
  updateBirds(dt, t);
  updateCamera(dt);
  updateDayNight(dt);
  updateWeather(dt);
  updateHUD();

  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

requestAnimationFrame(animate);


/* =============================================================
   远风归途 · 营地 / 任务 / 生存系统
   ============================================================= */
const game = {
  stamina: 100, hunger: 80, warmth: 70, rep: 0, gold: 12,
  wood: 0, horseFound: false, wagonFixed: false,
  quest: null, // { id, title, desc, step }
  dialogue: null,
  toastTimer: 0,
};

const BIOME_CN = {
  water: '水域', snow: '雪山', rock: '岩地', forest: '森林',
  savanna: '疏林草原', grass: '平原牧场',
};

const campNPCs = [];
const interactables = [];

function buildCampPerson(emojiColor, name, role) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(
    new THREE.CapsuleGeometry(0.28, 0.7, 4, 8),
    new THREE.MeshStandardMaterial({ color: emojiColor, roughness: 0.85 })
  );
  body.position.y = 1.05; body.castShadow = true; g.add(body);
  const head = new THREE.Mesh(
    new THREE.SphereGeometry(0.22, 12, 10),
    new THREE.MeshStandardMaterial({ color: 0xd4a574, roughness: 0.7 })
  );
  head.position.y = 1.72; head.castShadow = true; g.add(head);
  g.userData.name = name;
  g.userData.role = role;
  return g;
}

function buildCampfireMesh() {
  const g = new THREE.Group();
  const logMat = new THREE.MeshStandardMaterial({ color: 0x4a3020, roughness: 0.95 });
  for (let i = 0; i < 3; i++) {
    const log = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.1, 1.2, 6), logMat);
    log.rotation.z = Math.PI / 2;
    log.rotation.y = (i / 3) * Math.PI;
    log.position.y = 0.08;
    g.add(log);
  }
  const flame = new THREE.Mesh(
    new THREE.ConeGeometry(0.35, 0.9, 6),
    new THREE.MeshStandardMaterial({ color: 0xff8830, emissive: 0xff5500, emissiveIntensity: 1.2, transparent: true, opacity: 0.85 })
  );
  flame.position.y = 0.55;
  g.add(flame);
  g.userData.flame = flame;
  const light = new THREE.PointLight(0xff8844, 1.2, 18);
  light.position.y = 1.2;
  g.add(light);
  g.userData.light = light;
  return g;
}

function buildWagonMesh(broken) {
  const g = new THREE.Group();
  const wood = new THREE.MeshStandardMaterial({ color: 0x6b4a2b, roughness: 0.9 });
  const bed = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.3, 1.4), wood);
  bed.position.y = 0.9; bed.castShadow = true; g.add(bed);
  const cover = new THREE.Mesh(
    new THREE.CylinderGeometry(0.9, 0.9, 2.2, 8, 1, false, 0, Math.PI),
    new THREE.MeshStandardMaterial({ color: 0xd4c4a0, roughness: 0.95, side: THREE.DoubleSide })
  );
  cover.rotation.z = Math.PI / 2; cover.position.y = 1.5; g.add(cover);
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
    const wheel = new THREE.Mesh(
      new THREE.TorusGeometry(0.45, 0.08, 6, 14),
      new THREE.MeshStandardMaterial({ color: broken && sx === 1 && sz === 1 ? 0x3a2a1a : 0x2a1a0a, roughness: 0.9 })
    );
    wheel.position.set(sx * 0.9, broken && sx === 1 && sz === 1 ? 0.2 : 0.45, sz * 0.75);
    wheel.rotation.y = Math.PI / 2;
    if (broken && sx === 1 && sz === 1) wheel.rotation.z = 0.8;
    g.add(wheel);
  }
  return g;
}

function spawnCamp() {
  const cx = 55, cz = -32;
  // flatten-ish camp pads by placing on height
  const fire = buildCampfireMesh();
  fire.position.set(cx, heightAt(cx, cz), cz);
  fire.userData.interact = 'campfire';
  fire.userData.label = '篝火休息';
  scene.add(fire);
  interactables.push(fire);

  const wagon = buildWagonMesh(true);
  wagon.position.set(cx + 6, heightAt(cx + 6, cz + 2), cz + 2);
  wagon.userData.interact = 'wagon';
  wagon.userData.label = '损坏的马车';
  wagon.userData.broken = true;
  scene.add(wagon);
  interactables.push(wagon);

  const npcs = [
    { name: '艾琳·布鲁克斯', role: '社群长者', color: 0x8a6a4a, ox: -3, oz: 1, dialogue: 'elin' },
    { name: '托马斯·怀特', role: '铁匠', color: 0x5a5a6a, ox: 4, oz: 3, dialogue: 'thomas' },
    { name: '小玛莉·陈', role: '记录员', color: 0x6a4a6a, ox: -2, oz: -3, dialogue: 'mary' },
    { name: '吉米·霍金斯', role: '乐手', color: 0x4a6a5a, ox: 2, oz: -2, dialogue: 'jimmy' },
    { name: '萨拉·米勒', role: '草药师', color: 0x5a7a4a, ox: -4, oz: 3, dialogue: 'sara' },
    { name: '老山姆·里维拉', role: '向导', color: 0x6a5a3a, ox: 3, oz: -4, dialogue: 'sam' },
  ];
  for (const n of npcs) {
    const p = buildCampPerson(n.color, n.name, n.role);
    const x = cx + n.ox, z = cz + n.oz;
    p.position.set(x, heightAt(x, z), z);
    p.lookAt(cx, heightAt(x, z), cz);
    p.userData.interact = 'npc';
    p.userData.dialogue = n.dialogue;
    p.userData.label = `${n.name}（${n.role}）`;
    scene.add(p);
    campNPCs.push(p);
    interactables.push(p);
  }

  // Fallen oak for wood quest
  const oakX = 20, oakZ = 10;
  const oak = new THREE.Group();
  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.35, 0.45, 5, 8),
    new THREE.MeshStandardMaterial({ color: 0x5a3d22, roughness: 0.95 })
  );
  trunk.rotation.z = Math.PI / 2; trunk.position.y = 0.4; trunk.castShadow = true;
  oak.add(trunk);
  oak.position.set(oakX, heightAt(oakX, oakZ), oakZ);
  oak.userData.interact = 'oak';
  oak.userData.label = '倒下的橡树';
  scene.add(oak);
  interactables.push(oak);

  // Lost horse
  const lostHorse = buildBoxHorse();
  lostHorse.scale.setScalar(0.85);
  const hx = 10, hz = -55;
  lostHorse.position.set(hx, heightAt(hx, hz), hz);
  lostHorse.userData.interact = 'lost_horse';
  lostHorse.userData.label = '走失的驮马';
  scene.add(lostHorse);
  interactables.push(lostHorse);

  // Tent markers
  for (let i = 0; i < 4; i++) {
    const ang = (i / 4) * Math.PI * 2 + 0.4;
    const tx = cx + Math.cos(ang) * 8;
    const tz = cz + Math.sin(ang) * 8;
    const tent = new THREE.Mesh(
      new THREE.ConeGeometry(1.6, 2.2, 4),
      new THREE.MeshStandardMaterial({ color: 0xc4a878, roughness: 0.95 })
    );
    tent.position.set(tx, heightAt(tx, tz) + 1.1, tz);
    tent.castShadow = true;
    scene.add(tent);
  }
}

const DIALOGUES = {
  elin: [
    { speaker: '艾琳·布鲁克斯', text: '年轻人，谢谢你愿意停下脚步。我们是晨曦旅社——一群彼此扶持的旅人。' },
    { speaker: '艾琳·布鲁克斯', text: '马车轮轴断了，托马斯正在想办法。你愿意帮我们找一根合适的橡木轴吗？',
      choices: [
        { label: '当然，我很乐意帮忙', action: 'start_wagon' },
        { label: '橡树在哪里？', action: 'start_wagon' },
      ]},
  ],
  thomas: [
    { speaker: '托马斯·怀特', text: '你是艾琳说的那位好心人？北边有棵倒下的橡树，材质正好。' },
    { speaker: '托马斯·怀特', text: '找到木轴后，回来按 E 修理马车就行。' },
  ],

  ],

    { speaker: '萨拉·米勒', text: '走路久了记得休息。这瓶草药茶可以恢复一些体力。', action: 'give_tea' },
  ],
  sam: [
    { speaker: '老山姆·里维拉', text: '年轻人，前面的路我走了几十年。营地在这里，迷路了按 R 就能回来。' },

  oak_done: [
    { speaker: '系统', text: '你找到了合适的橡木轴。带回营地修理马车吧。' },
  ],

      choices: [{ label: '我这就去找', action: 'start_horse' }] },
  ],

  ],
  campfire: [
    { speaker: '系统', text: '你在篝火旁休息，体力与温暖得到了恢复。', action: 'rest' },
  ],
};

function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.display = 'block';
  game.toastTimer = 2.5;
}

function setQuest(id, title, desc) {
  game.quest = { id, title, desc };
  document.getElementById('quest-tracker').style.display = 'block';
  document.getElementById('q-title').textContent = title;
  document.getElementById('q-desc').textContent = desc;
}

function clearQuest() {
  game.quest = null;
  document.getElementById('quest-tracker').style.display = 'none';
}

function openDialogue(id) {
  const lines = DIALOGUES[id];
  if (!lines) return;
  game.dialogue = { lines, idx: 0 };
  renderDialogue();
  document.exitPointerLock();
}

function renderDialogue() {
  const d = game.dialogue;
  if (!d) { document.getElementById('dialogue').style.display = 'none'; return; }
  const line = d.lines[d.idx];
  document.getElementById('dialogue').style.display = 'block';
  document.getElementById('dlg-speaker').textContent = line.speaker || '';
  document.getElementById('dlg-text').textContent = line.text;
  const box = document.getElementById('dlg-choices');
  box.innerHTML = '';
  const cont = document.getElementById('dlg-continue');
  if (line.choices) {
    cont.style.display = 'none';
    line.choices.forEach((c, i) => {
      const btn = document.createElement('button');
      btn.textContent = `${i + 1}. ${c.label}`;
      btn.onclick = () => { runAction(c.action); closeDialogue(); };
      box.appendChild(btn);
    });
  } else {
    cont.style.display = 'block';
    box.innerHTML = '';
  }
  if (line.action && !line.choices) runAction(line.action);
}

function advanceDialogue() {
  if (!game.dialogue) return;
  const line = game.dialogue.lines[game.dialogue.idx];
  if (line.choices) return;
  game.dialogue.idx++;
  if (game.dialogue.idx >= game.dialogue.lines.length) closeDialogue();
  else renderDialogue();
}

function closeDialogue() {
  game.dialogue = null;
  document.getElementById('dialogue').style.display = 'none';
  // Resume riding after conversation
  if (document.pointerLockElement !== canvas) {
    canvas.requestPointerLock();
    document.getElementById('start-screen').classList.add('hidden');
  }
}

function runAction(action) {
  if (!action) return;
  if (action === 'start_wagon') {
    setQuest('wagon', '帮修马车', '前往东北方向寻找倒下的橡树，采集木轴后返回修理马车。');
    showToast('新任务：帮修马车');
    game.rep += 2;
  }
  if (action === 'start_horse') {
    setQuest('horse', '寻回走失的马', '前往西边平原寻找走失的驮马。');
    showToast('新任务：寻回走失的马');
  }
  if (action === 'give_tea') {
    game.stamina = Math.min(100, game.stamina + 20);
    showToast('喝了药草茶，体力恢复');
  }
  if (action === 'rest') {
    game.stamina = Math.min(100, game.stamina + 35);
    game.warmth = Math.min(100, game.warmth + 25);
    game.hunger = Math.max(0, game.hunger - 5);
    showToast('篝火休息，状态恢复');
  }
}

function nearestInteractable() {
  let best = null, bestD = 8;
  for (const obj of interactables) {
    if (obj.userData.collected) continue;
    const d = horse.position.distanceTo(obj.position);
    if (d < bestD) { bestD = d; best = obj; }
  }
  return best;
}

function tryInteract() {
  if (game.dialogue) { advanceDialogue(); return; }
  const obj = nearestInteractable();
  if (!obj) return;
  const t = obj.userData.interact;
  if (t === 'npc') openDialogue(obj.userData.dialogue);
  else if (t === 'campfire') openDialogue('campfire');
  else if (t === 'oak') {
    if (!game.wood) {
      game.wood = 1;
      obj.userData.collected = true;
      obj.visible = false;
      showToast('获得橡木轴');
      if (game.quest?.id === 'wagon') {
        setQuest('wagon', '帮修马车', '带回营地，在马车旁按 E 修理。');
      }
      openDialogue('oak_done');
    }
  }
  else if (t === 'wagon') {
    if (obj.userData.broken && game.wood) {
      obj.userData.broken = false;
      game.wagonFixed = true;
      game.rep += 10; game.gold += 5;
      showToast('马车修理完成！声望 +10');
      clearQuest();
      openDialogue('wagon_done');
    } else if (obj.userData.broken) {
      showToast('需要先找到橡木轴');
    } else {
      showToast('马车已经修好了');
    }
  }
  else if (t === 'lost_horse') {
    game.horseFound = true;
    obj.userData.collected = true;
    obj.visible = false;
    game.rep += 15; game.gold += 8;
    showToast('找到走失的驮马！声望 +15');
    clearQuest();
    openDialogue('horse_done');
  }
}

function updateGame(dt) {
  // survival drain while riding
  if (state.pointerLocked && Math.abs(state.speed) > 1) {
    game.stamina = Math.max(0, game.stamina - dt * 1.2);
    game.hunger = Math.max(0, game.hunger - dt * 0.4);
  }
  const sunH = Math.max(0, Math.sin((state.timeOfDay - 6) / 24 * Math.PI * 2));
  if (sunH < 0.15) game.warmth = Math.max(0, game.warmth - dt * 1.5);
  else game.warmth = Math.min(100, game.warmth + dt * 0.3);

  // campfire flicker
  for (const obj of interactables) {
    if (obj.userData.interact === 'campfire' && obj.userData.flame) {
      const f = 0.9 + Math.sin(performance.now() * 0.01) * 0.2;
      obj.userData.flame.scale.setScalar(f);
      if (obj.userData.light) obj.userData.light.intensity = 1.0 + Math.random() * 0.4;
    }
  }

  // prompt
  const near = nearestInteractable();
  const prompt = document.getElementById('prompt');
  if (near && !game.dialogue && state.pointerLocked) {
    prompt.style.display = 'block';
    document.getElementById('prompt-text').textContent = near.userData.label || '互动';
  } else {
    prompt.style.display = 'none';
  }

  if (game.toastTimer > 0) {
    game.toastTimer -= dt;
    if (game.toastTimer <= 0) document.getElementById('toast').style.display = 'none';
  }
}

// Patch updateHUD
const _origUpdateHUD = updateHUD;
updateHUD = function() {
  _origUpdateHUD();
  const b = biomeAt(horse.position.x, horse.position.z);
  document.getElementById('hud-biome').textContent = BIOME_CN[b.name] || b.name;
  document.getElementById('hud-rep').textContent = game.rep;
  document.getElementById('bar-sta').style.width = game.stamina + '%';
  document.getElementById('bar-hun').style.width = game.hunger + '%';
  document.getElementById('bar-wrm').style.width = game.warmth + '%';
};

// Key E interact + R return to camp
window.addEventListener('keydown', (e) => {
  if (e.code === 'KeyE') {
    e.preventDefault();
    tryInteract();
  }
  if (e.code === 'KeyR') {
    horse.position.set(startPos.x, heightAt(startPos.x, startPos.z), startPos.z);
    showToast('已返回晨曦旅社营地');
  }
  if (game.dialogue) {
    const line = game.dialogue.lines[game.dialogue.idx];
    if (line?.choices) {
      const idx = parseInt(e.key) - 1;
      if (idx >= 0 && idx < line.choices.length) {
        runAction(line.choices[idx].action);
        closeDialogue();
      }
    }
  }
});

spawnCamp();
setQuest('meet', '遇见晨曦旅社', '靠近营地篝火旁的艾琳，按 E 与她交谈。');
document.getElementById('quest-tracker').style.display = 'block';

// Hook game update into horse tick (runs every frame while playing)
const _updateHorse = updateHorse;
updateHorse = function(dt) {
  _updateHorse(dt);
  updateGame(dt);
};

window.DAWN = { game, state, horse, scene };


// Expose for debug
window.SKY = { state, scene, camera, horse, terrain };
